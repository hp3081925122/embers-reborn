modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/YOUR_REPO/EmbersReborn/issues"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="embers_logo.png"
authors="${mod_authors}"
description='''${mod_description}

Ported to 1.21.1 NeoForge from Embers Rekindled (1.20.1 Forge) by RCXcrafter.
Original mod: https://github.com/RCXcrafter/EmbersRekindled
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# JEI — optional
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="NONE"
side="BOTH"

# Curios — optional
[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9,)"
ordering="NONE"
side="BOTH"
